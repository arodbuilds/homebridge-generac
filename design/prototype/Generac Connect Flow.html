<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect flow</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/tokens/colors.css">
<link rel="stylesheet" href="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/tokens/typography.css">
<link rel="stylesheet" href="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/tokens/spacing.css">
<link rel="stylesheet" href="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/tokens/base.css">
<link rel="stylesheet" href="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/styles.css">
<script src="_ds/homebridge-plugin-shell-fcc948b5-b88a-489d-bb24-a694a32f01d6/_ds_bundle.js"></script>
<style>
html.dark-mode{--bs-body-bg:#1c1c1c;--bs-body-color:#ffffff;--bs-secondary-color:rgba(222,226,230,.75);--bs-tertiary-color:rgba(222,226,230,.5);--bs-border-color:#495057;--bs-border-color-translucent:rgba(255,255,255,.15);--bs-secondary-bg:#343a40;--bs-link-color:#6ea8fe;--bs-link-hover-color:#8bb9fe;--bs-warning-bg-subtle:#3a3524;--bs-warning-text-emphasis:#ffe69c;--bs-card-cap-bg:#262626;--bs-success-bg-subtle:#051b11;--bs-success-border-subtle:#0f5132;--bs-success-text-emphasis:#75b798;--bs-danger-bg-subtle:#2c0b0e;--bs-danger-border-subtle:#842029;--bs-danger-text-emphasis:#ea868f;--bs-info-bg-subtle:#032830;--bs-info-border-subtle:#087990;--bs-info-text-emphasis:#6edff6;--bs-focus-ring-color:rgba(110,168,254,.25)}
.gn-page{max-width:800px;margin:0 auto;padding:16px;overflow-wrap:anywhere}
.gn-state{font-size:var(--text-help-size);color:var(--ns-secondary);margin:0 0 8px}
.gn-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:8px}
.gn-span12{grid-column:span 12}.gn-span6{grid-column:span 6}.gn-span4{grid-column:span 4}
@media (max-width:599px){.gn-span6,.gn-span4{grid-column:span 12}}
.gn-body{margin:0 0 12px}
.gn-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 16px}
.gn-err{margin:0 0 16px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){var q=new URLSearchParams(location.search);if(q.get('theme')==='dark'){document.body.classList.add('dark-mode');document.documentElement.classList.add('dark-mode')}
function post(){var h=document.body.scrollHeight;if(window.parent!==window&&h>100)window.parent.postMessage({type:'gn-height',id:q.get('id'),height:h+10},'*')}
window.addEventListener('load',function(){post();new ResizeObserver(post).observe(document.getElementById('root'));var n=0,t=setInterval(function(){post();if(++n>20)clearInterval(t)},250)});})();
</script>
<script type="text/babel">
const { Card, Button, TextField, PasswordField, StatusBox } = window.HomebridgePluginShell_fcc948;
const EMAIL = 'alex@example.com';

function Credentials({ error, busy }) {
  return (
    <Card title="Mobile Link account">
      <div className="gn-grid">
        <div className="gn-span6"><TextField id={'c-email-' + (error || 'ok')} label="Email" type="email" required placeholder="e.g. you@example.com" defaultValue={busy || error ? EMAIL : ''} /></div>
        <div className="gn-span6"><PasswordField id={'c-pass-' + (error || 'ok')} label="Password" required help="Used once to sign in. Not stored." defaultValue={busy || error ? 'correct horse battery' : ''} /></div>
      </div>
      {error && <StatusBox tone="danger" style={{ marginBottom: '16px' }}>{error}</StatusBox>}
      <div className="gn-actions">
        <Button variant="add" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</Button>
        <Button variant="link" disabled={busy}>Cancel</Button>
      </div>
    </Card>
  );
}
function Code({ body, error, locked }) {
  return (
    <Card title="Enter your code">
      <p className="gn-body">{body}</p>
      <p className="gn-body">Didn't get it? Cancel and sign in again.</p>
      <div className="gn-grid">
        <div className="gn-span4"><TextField id={'code-' + (error ? 'e' : 'ok')} label="Code" required mono placeholder="e.g. 123456" defaultValue={error ? '482913' : ''} /></div>
      </div>
      {error && <StatusBox tone="danger" style={{ marginBottom: '16px' }}>{error}</StatusBox>}
      <div className="gn-actions">
        <Button variant="add" disabled={locked}>Continue</Button>
        <Button variant="link">Cancel</Button>
      </div>
    </Card>
  );
}
function Unsupported() {
  return (
    <Card title="Mobile Link account">
      <p className="gn-body">Your account uses a sign-in method this plugin can't complete. In the Mobile Link app, switch to text message or an authenticator app, then try again.</p>
      <div className="gn-actions"><Button variant="outline">Cancel</Button></div>
    </Card>
  );
}

const states = [
  ['Step 1, credentials', <Credentials />],
  ['Step 1, signing in', <Credentials busy />],
  ['Step 1, wrong password', <Credentials error="Mobile Link rejected that password. If you haven't reset it since Generac's security update on April 21, 2026, reset it in the Mobile Link app, then try again." />],
  ['Step 1, unknown email', <Credentials error="Mobile Link doesn't recognize that email." />],
  ['Step 1, network or other failure', <Credentials error="Couldn't reach Mobile Link. Try again in a minute." />],
  ['Step 2, SMS', <Code body="Mobile Link texted a code to the phone on your account." />],
  ['Step 2, authenticator app', <Code body="Enter the code from your authenticator app." />],
  ['Step 2, email', <Code body={`Mobile Link emailed a code to ${EMAIL}.`} />],
  ['Step 2, wrong code', <Code body="Mobile Link texted a code to the phone on your account." error="That code didn't work. Check for a newer message and try again." />],
  ['Step 2, three failures', <Code body="Mobile Link texted a code to the phone on your account." error="Too many attempts. Cancel and sign in again." locked />],
  ['Unsupported factor (push, security key, voice call)', <Unsupported />],
];
function Page() {
  return (
    <div className="gn-page" data-screen-label="Connect flow">
      {states.map(([name, el], i) => <div key={i} style={{ marginBottom: i < states.length - 1 ? '24px' : 0 }}><p className="gn-state">{name}</p>{el}</div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
